<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 230" width="600" height="230" role="img" aria-label="Little Monkey Mobile — Pair with your own Little Monkey node. Watch runs, approve operations and queue work while offline."><title>Little Monkey Mobile — Pair with your own Little Monkey node. Watch runs, approve operations and queue work while offline.</title><defs>
